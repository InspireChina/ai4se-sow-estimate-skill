<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>订单列表</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <h1>订单列表</h1>
  <form id="filter-form">
    <input type="text" name="orderNo" placeholder="订单号">
    <input type="text" name="buyer" placeholder="买家">
    <select name="status">
      <option value="all">全部状态</option>
      <option value="pending">待付款</option>
      <option value="paid">待发货</option>
      <option value="shipped">已发货</option>
    </select>
    <input type="date" name="from">
    <input type="date" name="to">
    <button type="submit">查询</button>
    <button type="button" id="export">导出 Excel</button>
  </form>
  <table id="order-table">
    <thead>
      <tr><th>订单号</th><th>买家</th><th>状态</th><th>金额</th><th>下单时间</th><th>操作</th></tr>
    </thead>
    <tbody>
      <tr><td>SO20260001</td><td>张三</td><td>待发货</td><td>128.00</td><td>2026-01-05 10:00</td><td><a href="order-detail.html">详情</a></td></tr>
      <tr><td>SO20260002</td><td>李四</td><td>已发货</td><td>66.00</td><td>2026-01-06 15:30</td><td><a href="order-detail.html">详情</a></td></tr>
    </tbody>
  </table>
  <nav class="pagination">
    <button type="button">上一页</button>
    <span>共 1 页</span>
    <button type="button">下一页</button>
  </nav>
  <script src="assets/app.js"></script>
</body>
</html>
