<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>订单详情</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <h1>订单详情</h1>
  <h2>基础信息</h2>
  <ul>
    <li>订单号：SO20260001</li>
    <li>买家：张三</li>
    <li>状态：待发货</li>
    <li>下单时间：2026-01-05 10:00</li>
  </ul>
  <h2>商品明细</h2>
  <table>
    <thead><tr><th>商品</th><th>数量</th><th>单价</th></tr></thead>
    <tbody><tr><td>示例商品</td><td>2</td><td>64.00</td></tr></tbody>
  </table>
  <h2>收货信息</h2>
  <p>示例地址</p>
  <h2>操作日志</h2>
  <ul>
    <li>2026-01-05 10:00 订单创建</li>
  </ul>
  <form id="ship-form">
    <input type="text" name="carrier" placeholder="物流公司">
    <input type="text" name="trackingNo" placeholder="物流单号">
    <button type="submit">确认发货</button>
  </form>
  <button type="button" id="cancel">取消订单</button>
  <script src="assets/app.js"></script>
</body>
</html>
